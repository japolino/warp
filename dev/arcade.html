<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warp arcade bench</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #15121c; color: #eee; }
  #bench { max-width: 560px; margin: 40px auto; padding: 0 16px; display: grid; gap: 12px; }
  #bench label { display: flex; gap: 8px; align-items: center; }
  fieldset { border: 1px solid #333; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  button { padding: 10px 18px; font: inherit; cursor: pointer; }
  pre { background: #0c0a10; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bench"></div>
<script type="module" src="./build/dev.js"></script>
</body>
</html>
